services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: transferpro
      TRANSFERPRO_OWNER_PASSWORD: ${TRANSFERPRO_OWNER_PASSWORD}
      TRANSFERPRO_APP_PASSWORD: ${TRANSFERPRO_APP_PASSWORD}
      TRANSFERPRO_AUTH_PASSWORD: ${TRANSFERPRO_AUTH_PASSWORD}
      TRANSFERPRO_QUEUE_PASSWORD: ${TRANSFERPRO_QUEUE_PASSWORD}
    ports:
      - '5432:5432'
    volumes:
      - ./docker/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d transferpro]
      interval: 2s
      timeout: 5s
      retries: 20
