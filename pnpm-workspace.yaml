minimumReleaseAgeExcludePrune: true
# 1.7.9 is younger than the release-age gate. Drop each line once that version installs without an exclude.
minimumReleaseAgeExclude:
  - '@better-auth/core@1.7.9'
  - '@better-auth/drizzle-adapter@1.7.9'
  - '@better-auth/kysely-adapter@1.7.9'
  - '@better-auth/memory-adapter@1.7.9'
  - '@better-auth/mongo-adapter@1.7.9'
  - '@better-auth/prisma-adapter@1.7.9'
  - '@better-auth/telemetry@1.7.9'
  - better-auth@1.7.9
# Babel still depends on semver 6.3.1, which this policy flags as a trust downgrade.
trustPolicy: no-downgrade
trustPolicyExclude:
  - semver

shellEmulator: true

# @sentry/browser-utils pulls web-vitals; 6.2.3 shipped the same day as the Sentry pin (#34).
# launch-editor 2.14.1 (via nuxt > @nuxt/devtools) and vite 8.3.1 (via vitest) are GHSA-587h-7wmj-h5pm (#393).
overrides:
  launch-editor: 2.14.2
  vite: ^8.3.3
  web-vitals: 6.2.2

allowBuilds:
  esbuild: true
  # vue-demi's postinstall points its entry at Vue 3. Nuxt UI pulls it in through VueUse.
  vue-demi: true

auditConfig:
  # dev-only via listhen (dev-server self-signed cert), not in the production bundle, revisit when node-forge > 1.4.0 ships.
  # build-time only via micromatch (nitropack globby, @nuxtjs/i18n fast-glob) on our own glob patterns, never user input, not in .output; no patched release yet, revisit when braces > 3.0.3 ships.
  # dev-only via @nuxt/devtools (nuxt and @sentry/nuxt), not shipped in production. simple-git >=4.0.1 and argv-parser >=2.0.1 break nuxi (no default export). Remove when nuxt ships a patched devtools.
  ignoreGhsas:
    - GHSA-86w9-cpqp-85rv
    - GHSA-vfj7-8cjw-p6xm
    - GHSA-x6jw-m9v5-85vh
    - GHSA-g4wm-2vf7-vfgr
    - GHSA-858h-whjf-mvg5
    - GHSA-v5rq-49vh-5v5c
