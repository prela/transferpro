minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@nuxt/cli@4.0.0'
  - '@nuxt/kit@4.6.0'
  - '@nuxt/nitro-server@4.6.0'
  - '@nuxt/schema@4.6.0'
  - '@nuxt/vite-builder@4.6.0'
  - '@nuxt/vite-server@4.6.0'
  - nuxt@4.6.0
# Babel still depends on semver 6.3.1, which this policy flags as a trust downgrade.
# Nuxt 4.6 (@nuxt/vite-builder) still depends on cssnano 9.2.2 and its postcss plugin set, which this policy flags as a trust downgrade.
trustPolicy: no-downgrade
trustPolicyExclude:
  - semver
  - stylehacks
  - cssnano
  - cssnano-preset-default
  - cssnano-utils
  - postcss-calc
  - postcss-svgo
  - postcss-colormin
  - postcss-merge-rules
  - postcss-discard-empty
  - postcss-minify-params
  - postcss-normalize-url
  - postcss-convert-values
  - postcss-merge-longhand
  - postcss-ordered-values
  - postcss-reduce-initial
  - postcss-discard-comments
  - postcss-minify-gradients
  - postcss-minify-selectors
  - postcss-normalize-string
  - postcss-unique-selectors
  - postcss-normalize-charset
  - postcss-normalize-unicode
  - postcss-reduce-transforms
  - postcss-discard-duplicates
  - postcss-discard-overridden
  - postcss-minify-font-values
  - postcss-normalize-positions
  - postcss-normalize-whitespace
  - postcss-normalize-repeat-style
  - postcss-normalize-display-values
  - postcss-normalize-timing-functions

shellEmulator: true

# @sentry/browser-utils pulls web-vitals; 6.2.3 shipped the same day as the Sentry pin (#34).
overrides:
  web-vitals: 6.2.2

allowBuilds:
  esbuild: true
  # vue-demi's postinstall points its entry at Vue 3. Nuxt UI pulls it in through VueUse.
  vue-demi: true

auditConfig:
  # dev-only via listhen (dev-server self-signed cert), not in the production bundle, revisit when node-forge > 1.4.0 ships.
  # build-time only via micromatch (nitropack globby, @nuxtjs/i18n fast-glob) on our own glob patterns, never user input, not in .output; no patched release yet, revisit when braces > 3.0.3 ships.
  # dev-only via @nuxt/devtools (nuxt and @sentry/nuxt), not shipped in production. simple-git >=4.0.1 and argv-parser >=2.0.1 break nuxi (no default export). Remove when nuxt ships a patched devtools.
  ignoreGhsas:
    - GHSA-86w9-cpqp-85rv
    - GHSA-vfj7-8cjw-p6xm
    - GHSA-x6jw-m9v5-85vh
    - GHSA-g4wm-2vf7-vfgr
    - GHSA-858h-whjf-mvg5
    - GHSA-v5rq-49vh-5v5c
