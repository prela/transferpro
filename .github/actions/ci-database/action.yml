# Ephemeral roles for one CI job. The service container in ci.yml must use the
# same POSTGRES_USER, POSTGRES_PASSWORD, and POSTGRES_DB. Passwords are minted
# here and never committed. .env and .env.migrate stay on the runner disk.
name: CI database env
description: Mint ephemeral database roles, migrate, and write .env plus .env.migrate.

runs:
  using: composite
  steps:
    - name: Mint roles, migrate, and write env files
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update -qq
        sudo apt-get install -y -qq postgresql-client

        export POSTGRES_USER=postgres
        export POSTGRES_PASSWORD=postgres
        export POSTGRES_DB=transferpro
        export PGHOST=127.0.0.1
        export PGPORT=5432
        export PGPASSWORD=postgres

        owner_password=$(openssl rand -hex 24)
        app_password=$(openssl rand -hex 24)
        auth_password=$(openssl rand -hex 24)
        queue_password=$(openssl rand -hex 24)
        platform_password=$(openssl rand -hex 24)
        better_auth_secret=$(openssl rand -hex 32)
        echo "::add-mask::$owner_password"
        echo "::add-mask::$app_password"
        echo "::add-mask::$auth_password"
        echo "::add-mask::$queue_password"
        echo "::add-mask::$platform_password"
        echo "::add-mask::$better_auth_secret"

        export TRANSFERPRO_OWNER_PASSWORD="$owner_password"
        export TRANSFERPRO_APP_PASSWORD="$app_password"
        export TRANSFERPRO_AUTH_PASSWORD="$auth_password"
        export TRANSFERPRO_QUEUE_PASSWORD="$queue_password"
        export TRANSFERPRO_PLATFORM_PASSWORD="$platform_password"
        bash docker/postgres/init-roles.sh

        # RLS and e2e both refuse any database name other than transferpro_e2e.
        # The service's POSTGRES_DB stays transferpro so role setup has a
        # maintenance database. The suite URLs point at the database below.
        psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres <<'SQL'
        CREATE DATABASE transferpro_e2e;
        GRANT CONNECT ON DATABASE transferpro_e2e TO transferpro_owner, transferpro_app, transferpro_auth, transferpro_queue, transferpro_platform;
        GRANT CREATE ON DATABASE transferpro_e2e TO transferpro_owner;
        SQL

        umask 077
        cat > .env <<EOF
        TRANSFERPRO_OWNER_PASSWORD=${owner_password}
        TRANSFERPRO_APP_PASSWORD=${app_password}
        TRANSFERPRO_AUTH_PASSWORD=${auth_password}
        TRANSFERPRO_QUEUE_PASSWORD=${queue_password}
        TRANSFERPRO_PLATFORM_PASSWORD=${platform_password}
        DATABASE_URL=postgres://transferpro_app:${app_password}@127.0.0.1:5432/transferpro_e2e
        AUTH_DATABASE_URL=postgres://transferpro_auth:${auth_password}@127.0.0.1:5432/transferpro_e2e
        QUEUE_DATABASE_URL=postgres://transferpro_queue:${queue_password}@127.0.0.1:5432/transferpro_e2e
        PLATFORM_DATABASE_URL=postgres://transferpro_platform:${platform_password}@127.0.0.1:5432/transferpro_e2e
        BETTER_AUTH_SECRET=${better_auth_secret}
        BETTER_AUTH_URL=http://127.0.0.1:3000
        EOF
        cat > .env.migrate <<EOF
        DATABASE_MIGRATE_URL=postgres://transferpro_owner:${owner_password}@127.0.0.1:5432/transferpro_e2e
        EOF

        pnpm db:migrate:local
