# Push runs on develop and main. Every pull request runs too.
# A new push to the same ref cancels the run already in progress.
# Docs, markdown, and .cursor changes skip this workflow.
name: ci

on:
  push:
    branches: [develop, main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.cursor/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.cursor/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.10.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  slow:
    needs: fast
    runs-on: ubuntu-latest
    services:
      postgres:
        # docker.io is required. An unqualified name makes the runner call
        # `docker login` with an empty registry, which fails before the pull.
        image: docker.io/library/postgres:18
        # Service containers start before steps, so docker/login-action cannot
        # authenticate this pull. These credentials are the registry login
        # GitHub uses during Initialize containers (Docker Hub rate limit).
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: transferpro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d transferpro"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.10.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Generates .nuxt/ so the RLS vitest config can load .nuxt/tsconfig.app.json.
      - run: pnpm exec nuxi prepare

      # Roles, env files, and the migrate. The SQL lives in
      # docker/postgres/init-roles.sh. The action talks to this service over TCP.
      - name: Database roles
        uses: ./.github/actions/ci-database

      - name: Cross-tenant RLS suite
        run: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1091
          . ./.env
          . ./.env.migrate
          set +a
          pnpm test:rls

      # Disposable Postgres 18. The fast job has no Docker, so the restore
      # proof lives here. It does not use the service database.
      - name: Encrypted backup restore
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gnupg
          pnpm exec vitest run --config vitest.backup.config.ts

  # One production build for every shard. setup-node caches the pnpm store
  # from the lockfile. This job caches `.output` across runs and uploads it
  # for the shards. A shard downloads that artifact and does not run nuxi build.
  e2e-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.10.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Nuxt output cache key
        id: nuxt-cache
        run: echo "key=${{ runner.os }}-nuxt-output-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'pnpm-workspace.yaml', 'nuxt.config.ts', 'tsconfig.json', 'drizzle.config.ts', 'sentry.client.config.ts', 'sentry.server.config.ts', 'app/**', 'server/**', 'shared/**', 'db/**', 'i18n/**', 'public/**') }}" >> "$GITHUB_OUTPUT"

      - name: Restore Nuxt build
        id: nuxt-build
        uses: actions/cache/restore@v4
        with:
          path: .output
          key: ${{ steps.nuxt-cache.outputs.key }}

      - name: Build Nuxt
        if: steps.nuxt-build.outputs.cache-hit != 'true'
        run: pnpm exec nuxi build

      - name: Nuxt server is present
        run: test -f .output/server/index.mjs

      # A second run of this commit can save the same key first. The build is
      # already on disk; the artifact below is what the shards run.
      - name: Save Nuxt build
        if: steps.nuxt-build.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .output
          key: ${{ steps.nuxt-cache.outputs.key }}

      - name: Upload Nuxt build
        uses: actions/upload-artifact@v4
        with:
          name: nuxt-output
          path: .output
          include-hidden-files: true
          retention-days: 1

  # Three runners, one shard each. fail-fast stays off so a red shard does
  # not cancel the others: every spec still executes, and the merge job can
  # see every blob. The denominator matches the matrix length.
  e2e:
    needs: [fast, e2e-build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        # docker.io is required. An unqualified name makes the runner call
        # `docker login` with an empty registry, which fails before the pull.
        image: docker.io/library/postgres:18
        # Service containers start before steps, so docker/login-action cannot
        # authenticate this pull. These credentials are the registry login
        # GitHub uses during Initialize containers (Docker Hub rate limit).
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: transferpro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d transferpro"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.10.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The artifact is the build from this run. Shards do not restore the
      # cache and do not run nuxi build.
      - name: Download Nuxt build
        uses: actions/download-artifact@v4
        with:
          name: nuxt-output
          path: .output

      - name: Nuxt server is present
        run: test -f .output/server/index.mjs

      # Browsers live in the runner cache. OS packages do not, so a cache hit
      # still installs system dependencies. The key is the installed Playwright
      # version, which tracks the lockfile without busting on unrelated bumps.
      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Database roles
        uses: ./.github/actions/ci-database

      # Playwright sets NODE_ENV=test and clears RESEND_API_KEY.
      # scripts/e2e-server.mjs refuses to start if that is not true, so this
      # job cannot send mail through Resend. The migrate URL stays in
      # .env.migrate: the Playwright worker loads that file for seeding, and
      # the app process does not receive DATABASE_MIGRATE_URL.
      - name: End-to-end
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/3

      - name: Blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          if-no-files-found: ignore
          path: blob-report/

      - name: Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.shard }}
          if-no-files-found: ignore
          path: test-results/

  # One html report from the three blob zips. A failed shard still uploads,
  # so this job runs unless the suite was skipped or the run was cancelled.
  e2e-report:
    needs: e2e
    if: ${{ !cancelled() && needs.e2e.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.10.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge Playwright reports
        run: pnpm exec playwright merge-reports --reporter html ./all-blob-reports

      - name: Playwright report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          if-no-files-found: ignore
          path: playwright-report/
