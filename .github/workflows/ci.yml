# Push runs on develop and main. Every pull request runs too.
# A new push to the same ref cancels the run already in progress.
# Docs, markdown, and .cursor changes skip this workflow.
name: ci

on:
  push:
    branches: [develop, main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.cursor/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.cursor/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.10.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  slow:
    needs: fast
    runs-on: ubuntu-latest
    services:
      postgres:
        # docker.io is required. An unqualified name makes the runner call
        # `docker login` with an empty registry, which fails before the pull.
        image: docker.io/library/postgres:18
        # Service containers start before steps, so docker/login-action cannot
        # authenticate this pull. These credentials are the registry login
        # GitHub uses during Initialize containers (Docker Hub rate limit).
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: transferpro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d transferpro"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.10.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Generates .nuxt/ so the RLS vitest config can load .nuxt/tsconfig.app.json.
      - run: pnpm exec nuxi prepare

      # Roles are created here, not from a committed password. The SQL lives
      # in docker/postgres/init-roles.sh. PGHOST makes that script talk to the
      # service container over TCP; inside Docker it still uses the socket.
      - name: Cross-tenant RLS suite
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: transferpro
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

          owner_password=$(openssl rand -hex 24)
          app_password=$(openssl rand -hex 24)
          auth_password=$(openssl rand -hex 24)
          queue_password=$(openssl rand -hex 24)
          platform_password=$(openssl rand -hex 24)
          better_auth_secret=$(openssl rand -hex 32)
          echo "::add-mask::$owner_password"
          echo "::add-mask::$app_password"
          echo "::add-mask::$auth_password"
          echo "::add-mask::$queue_password"
          echo "::add-mask::$platform_password"
          echo "::add-mask::$better_auth_secret"

          export TRANSFERPRO_OWNER_PASSWORD="$owner_password"
          export TRANSFERPRO_APP_PASSWORD="$app_password"
          export TRANSFERPRO_AUTH_PASSWORD="$auth_password"
          export TRANSFERPRO_QUEUE_PASSWORD="$queue_password"
          export TRANSFERPRO_PLATFORM_PASSWORD="$platform_password"
          bash docker/postgres/init-roles.sh

          umask 077
          cat > .env <<EOF
          TRANSFERPRO_OWNER_PASSWORD=${owner_password}
          TRANSFERPRO_APP_PASSWORD=${app_password}
          TRANSFERPRO_AUTH_PASSWORD=${auth_password}
          TRANSFERPRO_QUEUE_PASSWORD=${queue_password}
          TRANSFERPRO_PLATFORM_PASSWORD=${platform_password}
          DATABASE_URL=postgres://transferpro_app:${app_password}@127.0.0.1:5432/transferpro
          AUTH_DATABASE_URL=postgres://transferpro_auth:${auth_password}@127.0.0.1:5432/transferpro
          QUEUE_DATABASE_URL=postgres://transferpro_queue:${queue_password}@127.0.0.1:5432/transferpro
          PLATFORM_DATABASE_URL=postgres://transferpro_platform:${platform_password}@127.0.0.1:5432/transferpro
          BETTER_AUTH_SECRET=${better_auth_secret}
          BETTER_AUTH_URL=http://127.0.0.1:3000
          EOF
          cat > .env.migrate <<EOF
          DATABASE_MIGRATE_URL=postgres://transferpro_owner:${owner_password}@127.0.0.1:5432/transferpro
          EOF

          set -a
          # shellcheck disable=SC1091
          . ./.env
          . ./.env.migrate
          set +a

          pnpm db:migrate:local
          pnpm test:rls

      # Disposable Postgres 18. The fast job has no Docker, so the restore
      # proof lives here. It does not use the service database.
      - name: Encrypted backup restore
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gnupg
          pnpm exec vitest run --config vitest.backup.config.ts

      # Browsers live in the runner cache. OS packages do not, so a cache hit
      # still installs system dependencies. The key is the installed Playwright
      # version, which tracks the lockfile without busting on unrelated bumps.
      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # The built app. Playwright sets NODE_ENV=test and clears RESEND_API_KEY.
      # scripts/e2e-server.mjs refuses to start if that is not true, so this
      # job cannot send mail through Resend. The migrate URL stays in
      # .env.migrate: the Playwright worker loads that file for seeding, and
      # the app process does not receive DATABASE_MIGRATE_URL.
      - name: End-to-end
        run: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1091
          . ./.env
          set +a
          pnpm exec nuxi build
          pnpm test:e2e

      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          if-no-files-found: ignore
          path: |
            playwright-report/
            test-results/
